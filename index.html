
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision Color Picker</title>
    <style>
        :root {
            --primary: #dc2626; /* Pure Red */
            --bg: #000000;      /* Pitch Black */
            --card-bg: #0a0a0a;
            --text: #ffffff;
            --text-muted: #a3a3a3;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(220, 38, 38, 0.15);
            max-width: 650px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border: 1px solid #1f1f1f;
        }

        .initial-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 300px;
            gap: 20px;
        }

        .upload-btn-large {
            background: var(--primary);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 18px;
            transition: opacity 0.2s;
            display: inline-block;
            text-align: center;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            outline: 1px solid rgba(0, 0, 0, 0.5);
        }
        .upload-btn-large:hover { opacity: 0.9; }

        .app-workspace {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .control-panel-group {
            display: flex;
            width: 100%;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            visibility: hidden;
            flex-wrap: wrap;
        }

        .top-toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
            justify-content: space-between;
        }

        .codes-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex: 1;
        }

        .code-box {
            background: #000000;
            padding: 6px 10px;
            border-radius: 6px;
            font-family: monospace;
            cursor: pointer;
            font-size: 13px;
            border: 1px solid #333333;
            outline: 1px solid rgba(255, 255, 255, 0.1);
            transition: background 0.2s;
            text-align: center;
            color: var(--text);
        }
        .code-box:hover { background: #1a1a1a; }

        .preview-container {
            display: flex;
            align-items: center;
            background: #000000;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #333333;
            outline: 1px solid rgba(255, 255, 255, 0.1);
            gap: 8px;
        }

        #colorPreview {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            outline: 1px solid rgba(0, 0, 0, 0.8);
            flex-shrink: 0;
        }

        .upload-btn-small {
            background: var(--primary);
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: opacity 0.2s;
            text-align: center;
            box-sizing: border-box;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.2);
            outline: 1px solid rgba(0, 0, 0, 0.5);
        }
        .upload-btn-small:hover { opacity: 0.9; }
        input[type="file"] { display: none; }

        .canvas-viewport {
            width: 100%;
            max-height: 480px;
            overflow: visible;
            border-radius: 8px;
            border: 2px solid #333333;
            outline: 1px solid rgba(255, 255, 255, 0.2);
            background: #000000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .canvas-container {
            position: relative;
            display: block;
            cursor: crosshair;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            max-height: 460px;
        }

        #magnifierWrapper {
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -60px);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            will-change: left, top;
        }

        #lensCanvas {
            border: 2px solid #ffffff;
            outline: 1px solid rgba(0, 0, 0, 0.9);
            border-radius: 50%;
            width: 120px;
            height: 120px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            background-color: #000;
            pointer-events: auto;
            cursor: crosshair;
        }

        .lens-zoom-slider {
            margin-top: 6px;
            width: 100px;
            pointer-events: auto;
            accent-color: var(--primary);
            cursor: pointer;
            outline: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .lens-handle {
            width: 50px;
            height: 20px;
            background: linear-gradient(to bottom, #dc2626, #7f1d1d);
            border: 2px solid #ffffff;
            outline: 1px solid rgba(0, 0, 0, 0.8);
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            margin-top: 6px;
            cursor: grab;
            pointer-events: auto;
            touch-action: none;
        }
        .lens-handle:active {
            cursor: grabbing;
        }

        footer {
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            z-index: 10000;
            position: relative;
        }

        #toast {
            position: fixed;
            bottom: 30px;
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 20000;
            border: 1px solid rgba(255, 255, 255, 0.2);
            outline: 1px solid rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="initial-screen" id="initialScreen">
            <label class="upload-btn-large">
                Choose Image
                <input type="file" id="imageLoaderInitial" accept="image/*">
            </label>
        </div>

        <div class="app-workspace" id="appWorkspace">
            <div class="control-panel-group" id="controlPanelGroup">
                <div class="top-toolbar">
                    <div class="codes-group">
                        <div class="preview-container">
                            <div id="colorPreview"></div>
                        </div>
                        <span class="code-box" id="hexCode" onclick="copyToClipboard(this.innerText)">HEX: --</span>
                        <span class="code-box" id="rgbCode" onclick="copyToClipboard(this.innerText)">RGB: --</span>
                    </div>

                    <label class="upload-btn-small">
                        Change Image
                        <input type="file" id="imageLoaderActive" accept="image/*">
                    </label>
                </div>
            </div>

            <div class="canvas-viewport" id="canvasViewport">
                <div class="canvas-container" id="canvasContainer">
                    <canvas id="imageCanvas"></canvas>
                    
                    <div id="magnifierWrapper">
                        <canvas id="lensCanvas" width="120" height="120"></canvas>
                        <input type="range" class="lens-zoom-slider" id="zoomRange" min="1" max="30" value="1">
                        <div class="lens-handle" id="lensHandle"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>Precision Color Picker</footer>

    <div id="toast">Copied to clipboard!</div>

    <script>
        const initialScreen = document.getElementById('initialScreen');
        const appWorkspace = document.getElementById('appWorkspace');
        const imageLoaderInitial = document.getElementById('imageLoaderInitial');
        const imageLoaderActive = document.getElementById('imageLoaderActive');
        
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const lensCanvas = document.getElementById('lensCanvas');
        const lensCtx = lensCanvas.getContext('2d');
        
        const canvasViewport = document.getElementById('canvasViewport');
        const canvasContainer = document.getElementById('canvasContainer');
        const magnifierWrapper = document.getElementById('magnifierWrapper');
        const lensHandle = document.getElementById('lensHandle');
        const controlPanelGroup = document.getElementById('controlPanelGroup');
        const colorPreview = document.getElementById('colorPreview');
        const hexCode = document.getElementById('hexCode');
        const rgbCode = document.getElementById('rgbCode');
        const toast = document.getElementById('toast');
        
        const zoomRange = document.getElementById('zoomRange');

        let img = new Image();
        let currentCanvasX = 0;
        let currentCanvasY = 0;
        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let animationFrameId = null;

        let isZoomDragging = false;
        let zoomStartY = 0;
        let startZoomVal = 1;
        let initialPinchDist = null;

        function handleImageUpload(e) {
            const reader = new FileReader();
            reader.onload = function (event) {
                img.onload = function () {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    
                    initialScreen.style.display = 'none';
                    appWorkspace.style.display = 'flex';
                    controlPanelGroup.style.visibility = 'visible';

                    currentCanvasX = img.width / 2;
                    currentCanvasY = img.height / 2;
                    updateMagnifierPosition();
                }
                img.src = event.target.result;
            }
            if (e.target.files[0]) {
                reader.readAsDataURL(e.target.files[0]);
            }
        }

        imageLoaderInitial.addEventListener('change', handleImageUpload);
        imageLoaderActive.addEventListener('change', handleImageUpload);

        zoomRange.addEventListener('input', () => {
            updateMagnifierPosition();
        });

        function getCanvasPosFromClient(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function updateMagnifierPosition() {
            if (!img.src) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = rect.width / canvas.width;
            const scaleY = rect.height / canvas.height;

            magnifierWrapper.style.display = 'flex';
            magnifierWrapper.style.left = `${currentCanvasX * scaleX}px`;
            magnifierWrapper.style.top = `${currentCanvasY * scaleY}px`;

            const zoom = parseInt(zoomRange.value);
            drawLens(currentCanvasX, currentCanvasY, zoom);
            pickColor(currentCanvasX, currentCanvasY);
        }

        function drawLens(targetX, targetY, zoom) {
            const lensSize = lensCanvas.width;
            lensCtx.clearRect(0, 0, lensSize, lensSize);

            const sourceWidth = lensSize / zoom;
            const startX = targetX - sourceWidth / 2;
            const startY = targetY - sourceWidth / 2;

            lensCtx.imageSmoothingEnabled = zoom < 8;
            lensCtx.drawImage(
                canvas,
                startX, startY, sourceWidth, sourceWidth,
                0, 0, lensSize, lensSize
            );

            const centerX = lensSize / 2;
            const centerY = lensSize / 2;
            const centerPixel = ctx.getImageData(Math.floor(targetX), Math.floor(targetY), 1, 1).data;
            const invR = 255 - centerPixel[0];
            const invG = 255 - centerPixel[1];
            const invB = 255 - centerPixel[2];

            lensCtx.fillStyle = `rgb(${invR}, ${invG}, ${invB})`;
            lensCtx.beginPath();
            lensCtx.arc(centerX, centerY, Math.max(2, zoom / 3), 0, 2 * Math.PI);
            lensCtx.fill();
            lensCtx.strokeStyle = `rgb(${centerPixel[0]}, ${centerPixel[1]}, ${centerPixel[2]})`;
            lensCtx.lineWidth = 1;
            lensCtx.stroke();
        }

        function pickColor(x, y) {
            const intX = Math.floor(x);
            const intY = Math.floor(y);
            if (intX < 0 || intY < 0 || intX >= canvas.width || intY >= canvas.height) return;
            
            const pixel = ctx.getImageData(intX, intY, 1, 1).data;
            const [r, g, b] = pixel;

            const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
            const rgb = `rgb(${r}, ${g}, ${b})`;

            colorPreview.style.backgroundColor = hex;
            hexCode.innerText = `HEX: ${hex}`;
            rgbCode.innerText = `RGB: ${rgb}`;
        }

        canvasContainer.addEventListener('click', (e) => {
            if (e.target.closest('#magnifierWrapper')) return;
            const pos = getCanvasPosFromClient(e.clientX, e.clientY);
            currentCanvasX = pos.x;
            currentCanvasY = pos.y;
            updateMagnifierPosition();
        });

        lensCanvas.addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = lensCanvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const lensSize = lensCanvas.width;
            const zoom = parseInt(zoomRange.value);

            const offsetXFromCenter = clickX - (lensSize / 2);
            const offsetYFromCenter = clickY - (lensSize / 2);

            currentCanvasX += offsetXFromCenter / zoom;
            currentCanvasY += offsetYFromCenter / zoom;

            currentCanvasX = Math.max(0, Math.min(canvas.width, currentCanvasX));
            currentCanvasY = Math.max(0, Math.min(canvas.height, currentCanvasY));

            updateMagnifierPosition();
        });

        // Mouse wheel zooming support for lens canvas and zoom slider
        function handleWheelZoom(e) {
            e.preventDefault();
            let currentZoom = parseInt(zoomRange.value);
            // Scroll down to zoom out, scroll up to zoom in
            if (e.deltaY > 0) {
                currentZoom = Math.max(1, currentZoom - 1);
            } else {
                currentZoom = Math.min(30, currentZoom + 1);
            }
            zoomRange.value = currentZoom;
            updateMagnifierPosition();
        }

        lensCanvas.addEventListener('wheel', handleWheelZoom, { passive: false });
        zoomRange.addEventListener('wheel', handleWheelZoom, { passive: false });

        let lastTapTime = 0;
        canvasContainer.addEventListener('dblclick', (e) => {
            isZoomDragging = true;
            zoomStartY = e.clientY;
            startZoomVal = parseInt(zoomRange.value);
        });

        canvasContainer.addEventListener('touchstart', (e) => {
            if (e.target.closest('#magnifierWrapper')) return;
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTapTime;
            if (tapLength < 300 && tapLength > 0 && e.touches.length === 1) {
                isZoomDragging = true;
                zoomStartY = e.touches[0].clientY;
                startZoomVal = parseInt(zoomRange.value);
                e.preventDefault();
            }
            lastTapTime = currentTime;

            if (e.touches.length === 2) {
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                startZoomVal = parseInt(zoomRange.value);
            }
        }, { passive: false });

        function startDrag(clientX, clientY) {
            isDragging = true;
            const pos = getCanvasPosFromClient(clientX, clientY);
            dragOffsetX = pos.x - currentCanvasX;
            dragOffsetY = pos.y - currentCanvasY;
        }

        lensHandle.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            startDrag(e.clientX, e.clientY);
        });

        lensHandle.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            e.preventDefault();
            const touch = e.touches[0];
            startDrag(touch.clientX, touch.clientY);
        }, { passive: false });

        window.addEventListener('mousemove', (e) => {
            if (isZoomDragging) {
                const diffY = zoomStartY - e.clientY;
                let newZoom = Math.min(30, Math.max(1, Math.round(startZoomVal + diffY / 15)));
                zoomRange.value = newZoom;
                updateMagnifierPosition();
                return;
            }

            if (!isDragging || !img.src) return;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            animationFrameId = requestAnimationFrame(() => {
                const pos = getCanvasPosFromClient(e.clientX, e.clientY);
                currentCanvasX = pos.x - dragOffsetX;
                currentCanvasY = pos.y - dragOffsetY;
                updateMagnifierPosition();
            });
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDist !== null) {
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const scaleFactor = currentDist / initialPinchDist;
                let newZoom = Math.min(30, Math.max(1, Math.round(startZoomVal * scaleFactor)));
                zoomRange.value = newZoom;
                updateMagnifierPosition();
                return;
            }

            if (isZoomDragging && e.touches.length === 1) {
                const diffY = zoomStartY - e.touches[0].clientY;
                let newZoom = Math.min(30, Math.max(1, Math.round(startZoomVal + diffY / 15)));
                zoomRange.value = newZoom;
                updateMagnifierPosition();
                return;
            }

            if (!isDragging || !img.src) return;
            const touch = e.touches[0];
            
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(() => {
                const pos = getCanvasPosFromClient(touch.clientX, touch.clientY);
                currentCanvasX = pos.x - dragOffsetX;
                currentCanvasY = pos.y - dragOffsetY;
                updateMagnifierPosition();
            });
        }, { passive: false });

        window.addEventListener('mouseup', () => { 
            isDragging = false; 
            isZoomDragging = false;
        });
        window.addEventListener('touchend', () => { 
            isDragging = false; 
            isZoomDragging = false;
            initialPinchDist = null;
        });

        function copyToClipboard(text) {
            const cleanText = text.split(': ')[1];
            navigator.clipboard.writeText(cleanText).then(() => {
                showToast();
            });
        }

        function showToast() {
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 1500);
        }
    </script>
</body>
</html>
