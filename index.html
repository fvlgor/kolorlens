
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision Color Picker</title>
    <style>
        :root {
            --primary: #ff0000;
            --bg: #000000;
            --card-bg: #0a0a0a;
            --text: #ffffff;
            --text-muted: #a3a3a3;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(255, 0, 0, 0.4), inset 0 0 10px rgba(255, 0, 0, 0.4); }
            50% { box-shadow: 0 0 25px rgba(255, 0, 0, 0.9), inset 0 0 20px rgba(255, 0, 0, 0.7); }
            100% { box-shadow: 0 0 10px rgba(255, 0, 0, 0.4), inset 0 0 10px rgba(255, 0, 0, 0.4); }
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 8px 12px 20px 12px;
        }

        .container {
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(255, 0, 0, 0.15);
            max-width: 1000px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border: 1px solid #1f1f1f;
            box-sizing: border-box;
            margin: 0 auto;
            min-height: 0;
        }

        .initial-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex: 1;
            gap: 20px;
        }

        .upload-btn-large {
            background: linear-gradient(135deg, #ff0000 0%, #990000 100%);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 18px;
            transition: opacity 0.2s;
            display: inline-block;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            outline: 1px solid rgba(0, 0, 0, 0.5);
        }
        .upload-btn-large:hover { opacity: 0.9; }

        .app-workspace {
            display: none;
            width: 100%;
            flex: 1;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-height: 0;
        }

        .control-panel-group {
            display: flex;
            width: 100%;
            gap: 10px;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .top-toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex-wrap: wrap;
        }

        .codes-group {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .code-box {
            padding: 6px 12px;
            border-radius: 6px;
            font-family: monospace;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: filter 0.2s;
            text-align: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .code-box:hover { filter: brightness(1.2); }

        .upload-btn-small {
            background: linear-gradient(135deg, #ff0000 0%, #990000 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: opacity 0.2s;
            text-align: center;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.2);
            outline: 1px solid rgba(0, 0, 0, 0.5);
        }
        .upload-btn-small:hover { opacity: 0.9; }
        input[type="file"] { display: none; }

        .canvas-viewport {
            width: 100%;
            flex: 1;
            min-height: 0;
            overflow: visible;
            border-radius: 8px;
            border: 2px solid #333333;
            outline: 1px solid rgba(255, 255, 255, 0.2);
            background: #000000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .canvas-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #magnifierWrapper {
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -80px);
            z-index: 2147483647;
            display: none;
            width: 160px;
            height: 160px;
            will-change: left, top;
        }

        #lensCanvas {
            border: none;
            border-radius: 50%;
            width: 160px;
            height: 160px;
            background-color: #000;
            pointer-events: auto;
            animation: pulseGlow 3s infinite ease-in-out;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><line x1="12" y1="2" x2="12" y2="22" stroke="white" stroke-width="2"/><line x1="12" y1="2" x2="12" y2="22" stroke="black" stroke-width="1"/><line x1="2" y1="12" x2="22" y2="12" stroke="white" stroke-width="2"/><line x1="2" y1="12" x2="22" y2="12" stroke="black" stroke-width="1"/></svg>') 12 12, crosshair;
        }

        .lens-wheel-btn {
            position: absolute;
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, #ff0000 0%, #990000 100%);
            border: 2px solid #ffffff;
            border-radius: 50%;
            top: 71px;
            left: 145px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
            z-index: 2147483648;
            touch-action: none;
        }

        footer {
            margin-top: 10px;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            z-index: 10000;
            position: relative;
            flex-shrink: 0;
            line-height: 1.5;
        }

        footer .credits {
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 3px;
            font-size: 12px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8), 0 0 20px rgba(255, 0, 0, 0.5);
        }

        #toast {
            position: fixed;
            bottom: 30px;
            background: #ff0000;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 20000;
            border: 1px solid rgba(255, 255, 255, 0.2);
            outline: 1px solid rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="initial-screen" id="initialScreen">
            <label class="upload-btn-large">
                Choose Image
                <input type="file" id="imageLoaderInitial" accept="image/*">
            </label>
        </div>
        <div class="app-workspace" id="appWorkspace">
            <div class="control-panel-group" id="controlPanelGroup">
                <div class="top-toolbar">
                    <div class="codes-group">
                        <span class="code-box" id="hexCode" onclick="copyToClipboard(this.innerText)">HEX: --</span>
                        <span class="code-box" id="rgbCode" onclick="copyToClipboard(this.innerText)">RGB: --</span>
                        <span class="code-box" id="pantoneCode" onclick="copyToClipboard(this.innerText)">PANTONE: --</span>
                    </div>
                    <label class="upload-btn-small">
                        Change Image
                        <input type="file" id="imageLoaderActive" accept="image/*">
                    </label>
                </div>
            </div>
            <div class="canvas-viewport" id="canvasViewport">
                <div class="canvas-container" id="canvasContainer">
                    <canvas id="imageCanvas"></canvas>
                    <div id="magnifierWrapper">
                        <canvas id="lensCanvas" width="160" height="160"></canvas>
                        <div class="lens-wheel-btn" id="lensWheelBtn"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <div class="credits">Created by KAWN HYPERSYSTEMS</div>
        <div><strong>Instructions:</strong> Drag directly inside the lens or click anywhere on the image to inspect coordinates.</div>
        <div>Use mouse wheel over the lens or drag the circular wheel button to adjust zoom. Click code boxes to copy values.</div>
    </footer>
    <div id="toast">Copied to clipboard!</div>
    <script>
        const _0x5a3e = ["Q095QklHSFRDIEtBV04gSElQRVJZU1RFTVMgMjAyNg==", "atob"];
        const verifyOwnership = () => { try { return window[_0x5a3e[1]](_0x5a3e[0]); } catch(e) { return ""; } };

        const initialScreen = document.getElementById('initialScreen');
        const appWorkspace = document.getElementById('appWorkspace');
        const imageLoaderInitial = document.getElementById('imageLoaderInitial');
        const imageLoaderActive = document.getElementById('imageLoaderActive');
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const lensCanvas = document.getElementById('lensCanvas');
        const lensCtx = lensCanvas.getContext('2d');
        const canvasContainer = document.getElementById('canvasContainer');
        const magnifierWrapper = document.getElementById('magnifierWrapper');
        const lensWheelBtn = document.getElementById('lensWheelBtn');
        const controlPanelGroup = document.getElementById('controlPanelGroup');
        const hexCode = document.getElementById('hexCode');
        const rgbCode = document.getElementById('rgbCode');
        const pantoneCode = document.getElementById('pantoneCode');
        const toast = document.getElementById('toast');

        let img = new Image();
        let currentCanvasX = 0, currentCanvasY = 0;
        let isDraggingLens = false, isDraggingWheel = false;
        let dragOffsetX = 0, dragOffsetY = 0;
        let currentZoom = 1.5;
        let animationFrameId = null;

        function handleImageUpload(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    initialScreen.style.display = 'none';
                    appWorkspace.style.display = 'flex';
                    controlPanelGroup.style.visibility = 'visible';
                    currentCanvasX = img.width / 2;
                    currentCanvasY = img.height / 2;
                    updateMagnifierPosition();
                };
                img.src = event.target.result;
            };
            if (e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        }

        imageLoaderInitial.addEventListener('change', handleImageUpload);
        imageLoaderActive.addEventListener('change', handleImageUpload);

        function getCanvasPosFromClient(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function updateMagnifierPosition() {
            if (!img.src) return;
            const rect = canvas.getBoundingClientRect();
            const containerRect = canvasContainer.getBoundingClientRect();
            const leftPx = (rect.left - containerRect.left) + (currentCanvasX * (rect.width / canvas.width));
            const topPx = (rect.top - containerRect.top) + (currentCanvasY * (rect.height / canvas.height));
            magnifierWrapper.style.display = 'block';
            magnifierWrapper.style.left = `${leftPx}px`;
            magnifierWrapper.style.top = `${topPx}px`;
            drawLens(currentCanvasX, currentCanvasY, currentZoom);
            pickColor(currentCanvasX, currentCanvasY);
            updateWheelPosition();
        }

        function updateWheelPosition() {
            const normalized = (currentZoom - 1) / 29;
            const angle = -Math.PI / 2 + normalized * (1.5 * Math.PI);
            const x = 80 + 72 * Math.cos(angle) - 9;
            const y = 80 + 72 * Math.sin(angle) - 9;
            lensWheelBtn.style.left = `${x}px`;
            lensWheelBtn.style.top = `${y}px`;
        }

        function getContrastYIQ(hexcolor) {
            const r = parseInt(hexcolor.substr(1,2),16);
            const g = parseInt(hexcolor.substr(3,2),16);
            const b = parseInt(hexcolor.substr(5,2),16);
            return ((r * 299 + g * 587 + b * 114) / 1000 >= 128) ? '#000000' : '#ffffff';
        }

        function drawLens(targetX, targetY, zoom) {
            const lensSize = lensCanvas.width;
            lensCtx.clearRect(0, 0, lensSize, lensSize);
            const sourceWidth = lensSize / zoom;
            lensCtx.imageSmoothingEnabled = zoom < 8;
            lensCtx.drawImage(canvas, targetX - sourceWidth / 2, targetY - sourceWidth / 2, sourceWidth, sourceWidth, 0, 0, lensSize, lensSize);

            const intX = Math.floor(targetX);
            const intY = Math.floor(targetY);
            let hex = "#000000";
            if (intX >= 0 && intY >= 0 && intX < canvas.width && intY < canvas.height) {
                const pixel = ctx.getImageData(intX, intY, 1, 1).data;
                hex = "#" + ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1).toUpperCase();
            }

            const centerX = lensSize / 2;
            const centerY = lensSize / 2;
            lensCtx.beginPath();
            lensCtx.arc(centerX, centerY, 72.5, 0, 2 * Math.PI);
            lensCtx.strokeStyle = hex;
            lensCtx.lineWidth = 15;
            lensCtx.stroke();

            const centerPixel = ctx.getImageData(Math.max(0, Math.min(canvas.width - 1, intX)), Math.max(0, Math.min(canvas.height - 1, intY)), 1, 1).data;
            lensCtx.fillStyle = `rgb(${255 - centerPixel[0]}, ${255 - centerPixel[1]}, ${255 - centerPixel[2]})`;
            lensCtx.beginPath();
            lensCtx.arc(centerX, centerY, Math.max(2, zoom / 3), 0, 2 * Math.PI);
            lensCtx.fill();
            lensCtx.strokeStyle = `rgb(${centerPixel[0]}, ${centerPixel[1]}, ${centerPixel[2]})`;
            lensCtx.lineWidth = 1;
            lensCtx.stroke();
        }

        function approximatePantone(r, g, b) {
            const pmsList = [
                { name: "Pantone Neutral Black C", r: 43, g: 43, b: 43 },
                { name: "Pantone Cool Gray 1 C", r: 217, g: 217, b: 214 },
                { name: "Pantone Red 032 C", r: 239, g: 51, b: 64 },
                { name: "Pantone Process Blue C", r: 0, g: 130, b: 202 },
                { name: "Pantone Yellow C", r: 254, g: 221, b: 0 },
                { name: "Pantone Green C", r: 0, g: 148, b: 115 },
                { name: "Pantone Violet C", r: 77, g: 61, b: 142 },
                { name: "Pantone Orange 021 C", r: 254, g: 80, b: 0 },
                { name: "Pantone Reflex Blue C", r: 0, g: 10, b: 143 },
                { name: "Pantone White", r: 255, g: 255, b: 255 }
            ];
            let closest = pmsList[0], minDist = Infinity;
            for (let p of pmsList) {
                let dist = Math.pow(p.r - r, 2) + Math.pow(p.g - g, 2) + Math.pow(p.b - b, 2);
                if (dist < minDist) { minDist = dist; closest = p; }
            }
            return closest.name;
        }

        function pickColor(x, y) {
            const intX = Math.floor(x), intY = Math.floor(y);
            if (intX < 0 || intY < 0 || intX >= canvas.width || intY >= canvas.height) return;
            const [r, g, b] = ctx.getImageData(intX, intY, 1, 1).data;
            const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
            
            hexCode.innerText = `HEX: ${hex}`;
            hexCode.style.backgroundColor = hex;
            hexCode.style.color = getContrastYIQ(hex);

            rgbCode.innerText = `RGB: rgb(${r}, ${g}, ${b})`;
            rgbCode.style.backgroundColor = hex;
            rgbCode.style.color = getContrastYIQ(hex);

            pantoneCode.innerText = `PANTONE: ${approximatePantone(r, g, b)}`;
            pantoneCode.style.backgroundColor = hex;
            pantoneCode.style.color = getContrastYIQ(hex);
        }

        lensCanvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            currentZoom = e.deltaY > 0 ? Math.max(1, parseFloat((currentZoom - 0.5).toFixed(1))) : Math.min(30, parseFloat((currentZoom + 0.5).toFixed(1)));
            updateMagnifierPosition();
        }, { passive: false });

        lensCanvas.addEventListener('click', (e) => {
            const rect = lensCanvas.getBoundingClientRect();
            currentCanvasX = Math.max(0, Math.min(canvas.width, currentCanvasX + (e.clientX - rect.left - 80) / currentZoom));
            currentCanvasY = Math.max(0, Math.min(canvas.height, currentCanvasY + (e.clientY - rect.top - 80) / currentZoom));
            updateMagnifierPosition();
        });

        canvasContainer.addEventListener('click', (e) => {
            if (e.target.closest('#magnifierWrapper')) return;
            const pos = getCanvasPosFromClient(e.clientX, e.clientY);
            currentCanvasX = Math.max(0, Math.min(canvas.width, pos.x));
            currentCanvasY = Math.max(0, Math.min(canvas.height, pos.y));
            updateMagnifierPosition();
        });

        function startLensDrag(clientX, clientY) {
            isDraggingLens = true;
            const pos = getCanvasPosFromClient(clientX, clientY);
            dragOffsetX = pos.x - currentCanvasX;
            dragOffsetY = pos.y - currentCanvasY;
        }

        lensCanvas.addEventListener('mousedown', (e) => { e.stopPropagation(); startLensDrag(e.clientX, e.clientY); });
        lensCanvas.addEventListener('touchstart', (e) => { e.stopPropagation(); e.preventDefault(); startLensDrag(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });

        lensWheelBtn.addEventListener('mousedown', (e) => { e.stopPropagation(); isDraggingWheel = true; });
        lensWheelBtn.addEventListener('touchstart', (e) => { e.stopPropagation(); e.preventDefault(); isDraggingWheel = true; }, { passive: false });

        window.addEventListener('mousemove', (e) => {
            if (isDraggingWheel) {
                const rect = lensCanvas.getBoundingClientRect();
                let normalized = (Math.atan2(e.clientY - (rect.top + 80), e.clientX - (rect.left + 80)) + Math.PI / 2) / (1.5 * Math.PI);
                if (normalized < 0) normalized += 1;
                currentZoom = Math.min(30, Math.max(1, parseFloat((1 + normalized * 29).toFixed(1))));
                updateMagnifierPosition();
                return;
            }
            if (!isDraggingLens || !img.src) return;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(() => {
                const pos = getCanvasPosFromClient(e.clientX, e.clientY);
                currentCanvasX = Math.max(0, Math.min(canvas.width, pos.x - dragOffsetX));
                currentCanvasY = Math.max(0, Math.min(canvas.height, pos.y - dragOffsetY));
                updateMagnifierPosition();
            });
        });

        window.addEventListener('touchmove', (e) => {
            if (isDraggingWheel && e.touches.length > 0) {
                const rect = lensCanvas.getBoundingClientRect();
                let normalized = (Math.atan2(e.touches[0].clientY - (rect.top + 80), e.touches[0].clientX - (rect.left + 80)) + Math.PI / 2) / (1.5 * Math.PI);
                if (normalized < 0) normalized += 1;
                currentZoom = Math.min(30, Math.max(1, parseFloat((1 + normalized * 29).toFixed(1))));
                updateMagnifierPosition();
                return;
            }
            if (!isDraggingLens || !img.src) return;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(() => {
                const pos = getCanvasPosFromClient(e.touches[0].clientX, e.touches[0].clientY);
                currentCanvasX = Math.max(0, Math.min(canvas.width, pos.x - dragOffsetX));
                currentCanvasY = Math.max(0, Math.min(canvas.height, pos.y - dragOffsetY));
                updateMagnifierPosition();
            });
        }, { passive: false });

        window.addEventListener('mouseup', () => { isDraggingLens = false; isDraggingWheel = false; });
        window.addEventListener('touchend', () => { isDraggingLens = false; isDraggingWheel = false; });
        window.addEventListener('resize', () => { if (img.src) updateMagnifierPosition(); });

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text.split(': ')[1]).then(() => {
                toast.style.opacity = '1';
                setTimeout(() => { toast.style.opacity = '0'; }, 1500);
            });
        }
    </script>
</body>
